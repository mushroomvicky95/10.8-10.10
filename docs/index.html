<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><base href="/10.8-10.10/"></head>
<body>
<script>
// Pages fallback: load the canonical main-site page so the same version is served even when Pages is configured to /docs.
fetch("index.html?docs="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(html=>document.open();document.write(html);document.close()).catch(()=>location.replace("/10.8-10.10/"));
</script>
<noscript>請開啟 JavaScript 後重新載入。</noscript>
</body></html>
